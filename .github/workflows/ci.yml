name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit publishable files
        run: python scripts/release_audit.py
      - name: Install optional MCP SDK
        if: matrix.python-version == '3.12'
        run: python -m pip install '.[mcp]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
      - name: Install and smoke-test entry points
        run: |
          python -m pip install .
          conversation-archive-index-chatgpt --help
          conversation-archive-index-codex --help
          conversation-archive-index-claude --help
          conversation-archive-search-claude --help
          conversation-archive-show-claude --help
